# WSO2 Choreo configuration for the Todo backend.
# Create a "Service" component in Choreo with this repo, branch, and component directory `server`,
# build preset NodeJS. Set MONGODB_URI as a secret environment variable under Configs & Secrets.
schemaVersion: 1.2

endpoints:
  - name: todo-api
    displayName: Todo API
    service:
      basePath: /
      port: 4000
    type: REST
    networkVisibilities:
      - Public
    schemaFilePath: openapi.yaml
